# Local Supabase configuration. Used by `npm run db:start` (Supabase CLI + Docker).
# Anything not set here uses the CLI defaults. See LOCAL_SUPABASE.md.
project_id = "website-audit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local email catcher: every magic-link / confirmation email lands here instead of being sent.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Local dev: no need to click a confirmation link after signing up with a password.
enable_confirmations = false
max_frequency = "1s"

# To try Google sign-in locally, create OAuth credentials in Google Cloud, add
# http://127.0.0.1:54321/auth/v1/callback as a redirect URI, then uncomment:
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
# skip_nonce_check = true
